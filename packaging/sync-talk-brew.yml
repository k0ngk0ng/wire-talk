name: Sync talk releases
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talk-package-sync
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      base: ${{ steps.sync.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/sync-talk.py brew
          if git ls-files --error-unmatch Formula/talk.rb >/dev/null 2>&1 && git diff --quiet -- Formula/talk.rb; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          name: talk-formula
          path: Formula/talk.rb
  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7
        with:
          stable: true
      - uses: actions/download-artifact@v4
        with:
          name: talk-formula
          path: .cache/talk
      - run: |
          brew tap k0ngk0ng/tap
          cp .cache/talk/talk.rb "$(brew --repository k0ngk0ng/tap)/Formula/talk.rb"
          brew install k0ngk0ng/tap/talk
          brew test k0ngk0ng/tap/talk
          test "$(wirectl talk version)" = "$(wirectl-talk version)"
  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reject stale update
        env:
          EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
      - uses: actions/download-artifact@v4
        with:
          name: talk-formula
          path: Formula
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/talk.rb
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified talk release'
            git push origin HEAD:main
          fi
